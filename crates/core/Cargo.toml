[package]
name = "inbox-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Dependency-light domain types and trait boundaries shared by the inbox daemon and downstream crates (kb-web, omi-bridge)."
license = "MIT"

[lib]
name = "inbox_core"
path = "src/lib.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
url         = "2"
async-trait = "0"

[lints]
workspace = true
