# cargo-tarpaulin configuration.
#
# Usage: `cargo tarpaulin` (picks this file up automatically).
#
# main.rs participates in coverage math. The pure helpers that used to live
# inline (`hash_password`, `pending::open_optional`, `adapters::build_enabled`)
# now live in the library and have direct unit tests. What's left in main.rs
# is genuinely untestable glue: `main` itself wires construction order,
# `init_logging` configures global tracing subscribers, `spawn_admin_server`
# and `adapters::spawn_all` fire-and-forget tokio::spawn loops, and
# `wait_for_shutdown_signal` wraps OS signal handlers. None of these have an
# observable return value worth asserting on.

[default]
all-features = true
exclude-files = ["tests/*"]
