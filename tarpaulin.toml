# cargo-tarpaulin configuration.
#
# Usage: `cargo tarpaulin` (picks this file up automatically).
#
# Excludes main.rs from coverage math. The remaining residents are pure glue:
# `init_logging` configures global tracing subscribers, `wait_for_shutdown_signal`
# wraps OS signal handlers, and `spawn_admin_server` / `spawn_adapters` are
# fire-and-forget `tokio::spawn` calls. None of these have observable return
# values that a unit test can usefully assert on. The pure helpers that *can*
# be tested (`hash_password`, `pending::open_optional`) live in the library and
# are covered there.

[default]
all-features = true
exclude-files = ["tests/*", "src/main.rs"]
